# Mission Control — session sync config
# Copy to sync-config.yaml (git-ignored) and edit. pyyaml is optional: if it is
# not installed, sync.py ignores this file and uses built-in defaults
# (`pip install pyyaml` to enable it).
#
# RECOMMENDED SETUP: scope the board to THIS vault only, starting empty.
# The board then shows only sessions you start by running `claude` from inside
# the vault, from `since` onward. Your other repos never appear.

# Where Claude Code stores sessions. ~ expands to your home dir.
claude_dir: "~/.claude"

# Vault root. "." = the repo root (folder containing scripts/).
vault_dir: "."

# Only index sessions whose working directory contains one of these strings.
# Set this to the vault's own path so ONLY sessions started from here show up.
allow:
  - 'Desktop\Obsidian'

# Only index sessions that START on/after this moment. Set it to "now" at setup
# so existing and setup sessions stay hidden and the board grows only from your
# next real session. IMPORTANT: ~/.claude timestamps are UTC, so write this in
# UTC, not local time. Format: "YYYY-MM-DD[THH:mm]".
# PowerShell to get UTC now:  (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm")
since: "2026-05-30T00:00"

# A session is "active" if its .jsonl was modified within this many minutes.
active_minutes: 30

# Archive raw transcripts (gzipped) before Claude Code prunes them.
archive: false
retention_days: 30

# Optional: prettier display names per folder basename.
name_map: {}

# With a tight `allow` above, a denylist is usually unnecessary.
deny: []
